services:
  mongodb:
    image: mongo:6
    container_name: medintel_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medintel_network

  backend:
    build:
      context: ./backend
    container_name: medintel_backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medintel
      - JWT_SECRET=medintel_super_secret_dev_key
    depends_on:
      - mongodb
    networks:
      - medintel_network

  frontend:
    build:
      context: ./frontend
    container_name: medintel_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - medintel_network

networks:
  medintel_network:
    driver: bridge

volumes:
  mongodb_data:
